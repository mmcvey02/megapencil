[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "megapencil"
version = "0.1.0"
description = "MegaPencil - a desktop vector graphics editor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5", "pyclipper>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
megapencil = "megapencil.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
megapencil = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
