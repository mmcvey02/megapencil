# Publishes a GitHub release with the .deb installer and the single-file AppImage attached.
# Runs when a version tag (v*) is pushed, or manually: Actions tab > Release > Run workflow.
# A manual run builds the chosen branch and creates the tag itself.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the AppImage and the .deb
        run: |
          sudo apt-get update -q
          packaging/build_deb.sh
      - name: Smoke-test the AppImage
        run: |
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          QT_QPA_PLATFORM=offscreen dist/MegaPencil-*.AppImage --appimage-extract-and-run --version
      - name: Publish the release
        run: |
          cat > notes.md <<'NOTES'
          MegaPencil is a vector graphics editor for Ubuntu.

          **Easiest: download `megapencil_*_amd64.deb`, double-click it and press Install.**
          MegaPencil then appears in your application menu and starts with one click. The package
          brings its own Python and Qt and works on Ubuntu 22.04 or newer (x86-64).

          **No installation:** download `MegaPencil-*-x86_64.AppImage`, mark it executable once
          (`chmod +x MegaPencil-*.AppImage`) and run it. On first start it offers to add itself
          to your application menu.

          See the README for features and known limits.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/megapencil_*.deb dist/MegaPencil-*.AppImage --clobber
          else
            gh release create "$TAG" dist/megapencil_*.deb dist/MegaPencil-*.AppImage --title "MegaPencil ${TAG#v}" --notes-file notes.md --latest --target "$GITHUB_SHA"
          fi
